name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "${{ vars.CACHIX_CACHE }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Perform checks
        run: nix flake check -L
      - name: Cachix Pins
        if: github.ref_name == 'main'
        env:
          CACHIX_CACHE: "${{ vars.CACHIX_CACHE }}"
        run: |
          mapfile -t outputs \
            < <(nix build \
              .#coden-server.unwrapped .#coden-rootfs .#coden-kernel \
              --no-link --print-out-paths)

          cachix pin $CACHIX_CACHE coden-server ${outputs[0]} --keep-revisions 1 --artifact bin/coden-server
          cachix pin $CACHIX_CACHE coden-rootfs ${outputs[1]} --keep-revisions 1 --artifact rootfs
          cachix pin $CACHIX_CACHE coden-kernel ${outputs[2]} --keep-revisions 1 --artifact kernel
