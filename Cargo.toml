[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/lukadev-0/coden"
license = "AGPL-3.0-only"

[workspace.dependencies]
workspace-hack = { path = "./crates/workspace-hack" }

coden-agent-api = { path = "./crates/coden-agent-api" }

anyhow = "1.0.104"
bytes = "1.12.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_with = "3.24.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
