[package]
name = "coden-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
workspace-hack.workspace = true

coden-agent-api = { workspace = true, features = ["client"] }
coden-vm.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

axum = { version = "0.8.9", features = ["macros"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
scalar_api_reference = { version = "0.2.16", features = ["axum"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
tracing-opentelemetry = "0.34.0"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
hex = "0.4.3"
